<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equal Earth for MapLibre GL JS — UMD bundle</title>
    <!--
      The plugin as a page without a bundler uses it: plain HTML, no TypeScript, so any static
      server rooted at the repository works (VS Code Live Server, `npx serve`, `npm run dev`),
      after `npm run build:js` has written dist/.

      MapLibre comes from unpkg, the plugin from the local dist/maplibre-gl-equal-earth.umd.min.js,
      which defines the `maplibreglEqualEarth` global. Its worker bundles are found next to it
      (dist/worker.iife.js for v5, dist/worker.mjs for v6); the readout says which path warps.

      URL parameters:
      - `?mlv=5|6` (default 5): MapLibre 5.24 from its classic script, or MapLibre 6.6, which
        ships no classic-script build and is `import()`ed, then handed to the same global.
      - `?style=<url>`: any EPSG:3857 vector style (default OpenFreeMap Liberty).
      - `?projection=equal|equal-earth|mercator` (default `equal`).
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1620;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e8eef5;
        pointer-events: none;
      }
      .panel button,
      .panel pre {
        pointer-events: auto;
      }
      .panel #cities {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .panel button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid #3d7ea6;
        border-radius: 4px;
        background: #12202f;
        color: #e8eef5;
        cursor: pointer;
      }
      .panel pre {
        margin: 0;
        padding: 8px 10px;
        max-width: min(640px, calc(100vw - 48px));
        border-radius: 4px;
        background: rgb(9 18 28 / 85%);
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <div id="cities"></div>
      <pre id="readout">loading…</pre>
    </div>

    <!-- The plugin: one classic script, the way a page without a bundler includes it. -->
    <script
      src="../dist/maplibre-gl-equal-earth.umd.min.js"
      onerror="document.getElementById('readout').textContent = 'dist/maplibre-gl-equal-earth.umd.min.js not found: run npm run build:js first.'"
    ></script>

    <script>
      (async () => {
        const params = new URLSearchParams(location.search);
        const mlv = params.get('mlv') === '6' ? 6 : 5;
        const style = params.get('style') || 'https://tiles.openfreemap.org/styles/liberty';
        const projection = params.get('projection') || 'equal';
        const readout = document.getElementById('readout');
        const CITIES = {
          Zürich: [8.54, 47.37],
          Tokyo: [139.69, 35.69],
          'San Francisco': [-122.42, 37.77],
          Anchorage: [-149.9, 61.22],
          Singapore: [103.82, 1.35],
        };

        const load = (element) =>
          new Promise((resolve, reject) => {
            element.onload = () => resolve();
            element.onerror = () => reject(new Error(`failed to load ${element.src || element.href}`));
            document.head.append(element);
          });

        /** MapLibre 5 defines the `maplibregl` global; MapLibre 6 is an ES module only. */
        async function loadMapLibre() {
          const base = mlv === 6 ? 'https://unpkg.com/maplibre-gl@6.6.0/dist/' : 'https://unpkg.com/maplibre-gl@5.24.0/dist/';
          await load(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: `${base}maplibre-gl.css` }));
          if (mlv === 6) return import(`${base}maplibre-gl.mjs`);
          await load(Object.assign(document.createElement('script'), { src: `${base}maplibre-gl.js` }));
          return window.maplibregl;
        }

        if (typeof maplibreglEqualEarth === 'undefined') return; // the script tag's onerror said why
        const maplibregl = await loadMapLibre();

        // Once, before the first map: MapLibre sizes its worker pool with the first map.
        const eqe = await maplibreglEqualEarth.installEqualEarth(maplibregl);

        const map = new maplibregl.Map({ container: 'map', style, center: [10, 20], zoom: 1.3 });
        // Right after `new Map`: the plugin waits for the style itself, and the Mercator view's
        // tiles are never fetched.
        map.setProjection({ type: projection });
        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibreglEqualEarth.EqualEarthControl(), 'top-right');

        const cities = document.getElementById('cities');
        for (const [name, center] of Object.entries(CITIES)) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = name;
          // Geographic coordinates, as always: the plugin converts them while Equal Earth is on.
          button.addEventListener('click', () => map.flyTo({ center, zoom: 9 }));
          cities.append(button);
        }
        const world = document.createElement('button');
        world.type = 'button';
        world.textContent = 'World';
        world.addEventListener('click', () => map.flyTo({ center: [10, 20], zoom: 1.3 }));
        cities.append(world);

        let cursor = 'move the cursor over the map';
        const fixed = (value) => value.toFixed(3);
        const render = () => {
          const center = map.getCenter();
          readout.textContent = [
            `maplibre-gl ${maplibregl.getVersion()} (${mlv === 6 ? 'ES module' : 'classic script'})`,
            `plugin: global maplibreglEqualEarth from ${new URL('../dist/maplibre-gl-equal-earth.umd.min.js', location.href).pathname}`,
            `tiles warped on: ${eqe.workerPath}`,
            `projection ${map.getProjection()?.type ?? '…'}; zoom ${map.getZoom().toFixed(2)}; centre ${fixed(center.lng)}, ${fixed(center.lat)}`,
            cursor,
          ].join('\n');
        };
        map.on('mousemove', (event) => {
          cursor = `cursor ${fixed(event.lngLat.lng)}, ${fixed(event.lngLat.lat)} (geographic)`;
          render();
        });
        map.on('moveend', render);
        map.on('idle', render);
        map.on('projectiontransition', render);
        map.on('error', (event) => console.error(event.error));
        window.__umdDemo = { map, eqe };
      })().catch((error) => {
        document.getElementById('readout').textContent = `failed: ${error instanceof Error ? error.message : error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
