<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Equal Earth for MapLibre GL JS — graticule</title>
    <style>
      .panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #e8eef5;
      }
      .panel button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid #3d7ea6;
        border-radius: 4px;
        background: #12202f;
        color: #e8eef5;
        cursor: pointer;
      }
      .panel pre {
        margin: 0;
        padding: 8px 10px;
        border-radius: 4px;
        background: rgb(9 18 28 / 85%);
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="panel">
      <button id="mode" type="button">Showing: Equal Earth</button>
      <pre id="readout">move the cursor over the map</pre>
    </div>
    <!-- A plain static server sends `.ts` as video/mp2t and the browser refuses it: say so on the page. -->
    <script
      type="module"
      src="demo/graticule.ts"
      onerror="document.getElementById('readout').textContent = [
        'This demo is TypeScript, compiled on the fly by the Vite dev server;',
        'a plain static server cannot run it. In the repository run:',
        '',
        '  npm run dev',
        '',
        'and open http://localhost:5173/',
      ].join('\n')"
    ></script>
  </body>
</html>
